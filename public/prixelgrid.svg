<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="PrixelGrid">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2d31"/>
      <stop offset="100%" stop-color="#1e1f22"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c5c7cc"/>
      <stop offset="100%" stop-color="#6a6d74"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="40" fill="url(#bg)"/>
  <!-- phone -->
  <rect x="18" y="28" width="26" height="72" rx="6" fill="url(#metal)"/>
  <rect x="21" y="34" width="20" height="58" rx="3" fill="#0c0d10"/>
  <rect x="21" y="34" width="20" height="4" fill="#16a34a"/>
  <!-- tablet -->
  <rect x="50" y="34" width="28" height="60" rx="6" fill="url(#metal)"/>
  <rect x="53" y="40" width="22" height="46" rx="3" fill="#0c0d10"/>
  <rect x="53" y="40" width="22" height="4" fill="#16a34a"/>
  <!-- laptop -->
  <rect x="84" y="40" width="30" height="42" rx="4" fill="url(#metal)"/>
  <rect x="87" y="45" width="24" height="30" rx="2" fill="#0c0d10"/>
  <rect x="87" y="45" width="24" height="3" fill="#16a34a"/>
  <rect x="82" y="82" width="34" height="6" rx="2" fill="#55585f"/>
</svg>
